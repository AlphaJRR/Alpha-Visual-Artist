name: Deploy AVA to Cloudflare Pages

on:
  push:
    branches:
      - GIT
    paths:
      - "artifacts/alpha-visual-artists/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-ava-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ava-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Replit/agent installs set this; CI must match for preinstall + lockfile parity.
      npm_config_user_agent: pnpm/11.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AVA site
        env:
          PORT: "18606"
          BASE_PATH: "/"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PORTAL_API_ENABLED: "false"
        run: pnpm --filter @workspace/alpha-visual-artists run build

      - name: Verify build output
        run: test -f artifacts/alpha-visual-artists/dist/public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-pages-dist
          path: artifacts/alpha-visual-artists/dist/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ava-pages-dist
          path: artifacts/alpha-visual-artists/dist/public

      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Cloudflare Pages deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Pages Edit + Account read)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy artifacts/alpha-visual-artists/dist/public --project-name=alpha-visual-artists --branch=GIT

# GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — API token with Cloudflare Pages Edit (+ Account read)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#   VITE_CLERK_PUBLISHABLE_KEY — optional; site builds without it (auth disabled)
#
# Cloudflare Git integration: if the Pages project is also connected to this repo,
# disable automatic builds on GIT or remove this workflow to avoid duplicate deploys.
